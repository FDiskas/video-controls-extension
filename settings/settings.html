<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Video Frame Controls shortcuts</title>
		<link rel="stylesheet" href="settings.css" />
	</head>
	<body>
		<main>
			<h1>Keyboard shortcuts</h1>
			<p class="hint">
				Click a shortcut, then press the new key combination. Press Esc to cancel.
				Shortcuts control the video under the pointer, or the largest video in
				view. They do nothing while you type in a text field.
			</p>
			<ul id="shortcuts" class="shortcuts"></ul>
			<footer>
				<button id="reset" type="button" class="secondary">Reset to defaults</button>
				<p id="status" class="status" role="status" aria-live="polite"></p>
			</footer>
		</main>
		<script src="settings.js"></script>
	</body>
</html>
